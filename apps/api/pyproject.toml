[project]
name = "ai-planning-platform-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "ai-planning-platform-ai",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0"
]

[tool.uv.sources]
ai-planning-platform-ai = { path = "../../packages/ai" }

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
